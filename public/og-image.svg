<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a12" />
      <stop offset="50%" stop-color="#0d1322" />
      <stop offset="100%" stop-color="#090d18" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <radialGradient id="glow-cyan" cx="20%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow-purple" cx="80%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#glow-cyan)" />
  <rect width="1200" height="630" fill="url(#glow-purple)" />
  <rect width="1200" height="630" fill="url(#grid)" />

  <!-- Top Accent Bar -->
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent)" />

  <!-- Branding Badge -->
  <g transform="translate(100, 100)">
    <!-- Hexagon icon -->
    <polygon points="40,5 75,25 75,65 40,85 5,65 5,25" fill="#131b2e" stroke="url(#accent)" stroke-width="4" stroke-linejoin="round" />
    <path d="M28 55 C24 55 21 52 21 48 C21 44 24 41 27 40 C28 34 34 30 40 30 C46 30 51 34 52 39 C56 40 59 43 59 47 C59 52 55 55 50 55 Z" fill="url(#accent)" />
    
    <!-- Wordmark -->
    <text x="95" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" fill="#ffffff" letter-spacing="-0.5">SantoGe</text>
    <text x="95" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#00e5ff" letter-spacing="3">TALENT CLOUD</text>
  </g>

  <!-- Title & Subtitle -->
  <text x="100" y="270" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" fill="#ffffff" letter-spacing="-1">
    Interactive Technical Skill Engine &amp;
  </text>
  <text x="100" y="335" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" fill="url(#accent)" letter-spacing="-1">
    Batch Placement Accelerator
  </text>
  
  <text x="100" y="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="400" fill="#94a3b8" width="1000">
    Dual-track readiness: 15 individual technical specialisations + synchronized 90-day placement cohort
  </text>

  <!-- Feature Pills -->
  <g transform="translate(100, 470)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="220" height="52" rx="14" fill="#131b2e" stroke="#1e293b" stroke-width="1.5" />
    <text x="24" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#00e5ff">15 Technical Tracks</text>

    <!-- Pill 2 -->
    <rect x="240" y="0" width="250" height="52" rx="14" fill="#131b2e" stroke="#1e293b" stroke-width="1.5" />
    <text x="264" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#a78bfa">Telegram Batch Cohort</text>

    <!-- Pill 3 -->
    <rect x="510" y="0" width="240" height="52" rx="14" fill="#131b2e" stroke="#1e293b" stroke-width="1.5" />
    <text x="534" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#f472b6">Dual Completion Gate</text>

    <!-- Pill 4 -->
    <rect x="770" y="0" width="240" height="52" rx="14" fill="#131b2e" stroke="#1e293b" stroke-width="1.5" />
    <text x="794" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#34d399">Recruiter Marketplace</text>
  </g>

  <!-- Footer Tag -->
  <text x="100" y="580" font-family="monospace" font-size="14" fill="#64748b">
    santoge.dev · Talent Intelligence Platform · Unified Talent Score
  </text>
</svg>
