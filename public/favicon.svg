<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="stc-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="cloud-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#d1d5db" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#00e5ff" flood-opacity="0.35" />
    </filter>
  </defs>
  <!-- Background Rounded Shield -->
  <rect width="128" height="128" rx="28" fill="#0b0f19" />
  
  <!-- Outer Hexagon Brand Badge -->
  <polygon points="64,18 104,41 104,87 64,110 24,87 24,41" fill="none" stroke="url(#stc-grad)" stroke-width="6" stroke-linejoin="round" filter="url(#glow)" />
  
  <!-- Stylized Cloud / Hexagon Core -->
  <path d="M48 76 C42 76 38 72 38 66 C38 61 41 57 46 56 C48 48 56 42 64 42 C72 42 79 47 81 54 C87 55 90 60 90 65 C90 71 85 76 79 76 Z" fill="url(#stc-grad)" />
  
  <!-- Central Spark / Talent Node -->
  <circle cx="64" cy="62" r="6" fill="#ffffff" />
  <circle cx="53" cy="66" r="3" fill="#ffffff" opacity="0.8" />
  <circle cx="75" cy="66" r="3" fill="#ffffff" opacity="0.8" />
</svg>
